                  remainingPeriods:
                    format: int64
                    type: integer
                type: object
              observedGeneration:
                format: int64
                type: integer
              opcert:
                description: OpCertStatus reports operational certificate counter
                  state.
                properties:
                  lastRotated:
                    format: date-time
                    type: string
                  onChainCounter:
                    description: |-
                      OnChainCounter is the highest opcert issue number the chain has accepted
                      for this pool, read from the node over node-to-client local-state-query.
                      Zero means "not observed": either the node could not be reached or the
                      pool has no counter on chain yet (it has never minted a block under an
                      operational certificate). Use OnChainCounterAt to tell how fresh
                      the value is — it is never cleared on a failed read, because a stale
                      counter is still a valid lower bound and clearing it would throw away the
                      only floor the operator has.
                    format: int64
                    type: integer
                  onChainCounterAt:
                    description: OnChainCounterAt is when onChainCounter was last
                      read successfully.
                    format: date-time
                    type: string
                  onChainCounterPoolId:
                    description: |-
                      OnChainCounterPoolID is the pool (hex cold-key hash) onChainCounter was
                      read for. It records the observation's provenance: a counter is only used
                      as a validation floor for the pool it was actually read for, so editing
                      spec.blockProducer.poolId discards it immediately instead of leaving it
                      enforced until it ages out.
                    type: string
                  onDiskCounter:
                    format: int64
                    type: integer
                type: object
              phase:
                description: Phase is a coarse lifecycle summary.
                type: string
              tip:
                description: Tip tracks tip slot progress; see the LedgerPipelineHealthy
                  condition.
                properties:
                  lastProgressAt:
                    description: LastProgressAt is when Slot last changed.
                    format: date-time
                    type: string
                  slot:
                    description: |-
                      Slot is the tip slot reported by the node on the last observation. With
                      several replicas it is the lowest slot across them.
                    format: int64
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
