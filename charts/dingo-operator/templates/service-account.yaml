{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dingoOperator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "dingoOperator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- else if not .Values.serviceAccount.name }}
{{- fail "serviceAccount.name is required when serviceAccount.create=false" }}
{{- end }}
