---
updateStrategy:
  type: RollingUpdate

cardano_network: preview
cardano_node:
  host: cardano-node-headless
  port: 30000

extraPodLabels: {}

image:
  repository: cardanosolutions/ogmios
  tag: "v7.0.0"
  pullPolicy: IfNotPresent
replicaCount: 1
resources: {}
socat:
  image:
    repository: alpine/socat
    digest: sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842
    pullPolicy: IfNotPresent
  resources: {}

configure:
  image:
    repository: curlimages/curl
    digest: sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    pullPolicy: IfNotPresent

# Extra CLI flags appended to the ogmios command
# (e.g. --include-cbor, --metadata-detailed-schema).
extraArgs: []

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: 1337
    scheme: HTTP

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: 1337
    scheme: HTTP

tolerations:
- key: kubernetes.io/arch
  operator: Equal
  value: arm64
  effect: NoSchedule

affinity: {}

ingress:
  enabled: false
  host: ogmios-api.preview.local

service:
  enabled: false
  annotations: {}
  ports:
    - name: http
      port: 1337
      protocol: TCP
      targetPort: 1337
  type: ClusterIP

serviceAccountName: ""

# PodMonitor configuration
podMonitor:
  enabled: false
  extraLabels: {}
  podTargetLabels: []
  podMetricsEndpoints:
  # port in Podmonitor should match containerPort name in deployment
    - port: http
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
