---
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# With availability enabled, a rollout retains ready replicas while a replacement catches up.
minReadySeconds: 30
terminationGracePeriodSeconds: 90

# Opt-in because availability depends on reachable reference relay metrics.
availability:
  enabled: false
  image:
    repository: docker.io/library/python
    tag: 3.13.16-alpine3.24
    digest: sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    pullPolicy: IfNotPresent
  # At least one URL is required. Multiple relays allow reference failover.
  referenceTipURLs: []
  maxSlotLag: 60
  # Maximum age of the last Ogmios tip update; also checked against relay slot lag.
  maxTipAgeSeconds: 600
  # Total per-request deadline, including name resolution, headers and body.
  requestTimeoutSeconds: 2
  pollIntervalSeconds: 5
  # Must exceed pollIntervalSeconds + requestTimeoutSeconds * (1 + reference count).
  maxCheckAgeSeconds: 30
  port: 18081
  # Let EndpointSlice changes propagate and finite requests finish before SIGTERM.
  # Uses native lifecycle sleep (Kubernetes 1.30+); zero omits the hook.
  drainDelaySeconds: 30
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

cardano_network: preview
cardano_node:
  host: cardano-node-headless
  port: 30000

extraPodLabels: {}

image:
  repository: cardanosolutions/ogmios
  tag: "v7.0.0"
  pullPolicy: IfNotPresent
replicaCount: 1
resources: {}
socat:
  image:
    repository: alpine/socat
    digest: sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842
    pullPolicy: IfNotPresent
  resources: {}

configure:
  image:
    repository: curlimages/curl
    digest: sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    pullPolicy: IfNotPresent

# Extra CLI flags appended to the ogmios command
# (e.g. --include-cbor, --metadata-detailed-schema).
extraArgs: []

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: 1337
    scheme: HTTP

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: 1337
    scheme: HTTP

tolerations:
- key: kubernetes.io/arch
  operator: Equal
  value: arm64
  effect: NoSchedule

affinity: {}

ingress:
  enabled: false
  host: ogmios-api.preview.local

service:
  enabled: false
  annotations: {}
  ports:
    - name: http
      port: 1337
      protocol: TCP
      targetPort: 1337
  type: ClusterIP

serviceAccountName: ""

# PodMonitor configuration
podMonitor:
  enabled: false
  extraLabels: {}
  podTargetLabels: []
  podMetricsEndpoints:
  # port in Podmonitor should match containerPort name in deployment
    - port: http
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
