{{- if .Values.availability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ogmios.fullname" . | trunc 50 | trimSuffix "-" }}-availability
  labels: {{ include "ogmios.labels" . | nindent 4 }}
data:
  readiness.py: |
    {{- .Files.Get "files/readiness.py" | nindent 4 }}
  readiness.json: {{ omit .Values.availability "enabled" "image" "resources" "drainDelaySeconds" | toJson | quote }}
{{- end }}
