{{- if .Values.service.private.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dingo.tieredServiceName" (dict "root" . "tier" "private") }}
  labels:
    {{- include "dingo.labels" . | nindent 4 }}
    dingo.blinklabs.io/service-tier: private
  {{- if .Values.service.private.annotations }}
  annotations: {{- toYaml .Values.service.private.annotations | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  {{- if .Values.service.private.sessionAffinity }}
  sessionAffinity: {{ .Values.service.private.sessionAffinity }}
  {{- end }}
  ports:
    - name: private
      port: {{ .Values.service.ports.private }}
      targetPort: {{ .Values.environment.CARDANO_PRIVATE_PORT | default .Values.service.ports.private }}
{{- if gt (int (default "0" (default .Values.service.ports.utxorpc .Values.environment.DINGO_UTXORPC_PORT))) 0 }}
    - name: utxorpc
      port: {{ .Values.environment.DINGO_UTXORPC_PORT | default .Values.service.ports.utxorpc }}
      targetPort: {{ .Values.environment.DINGO_UTXORPC_PORT | default .Values.service.ports.utxorpc }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.blockfrost .Values.environment.DINGO_BLOCKFROST_PORT))) 0 }}
    - name: blockfrost
      port: {{ .Values.environment.DINGO_BLOCKFROST_PORT | default .Values.service.ports.blockfrost }}
      targetPort: {{ .Values.environment.DINGO_BLOCKFROST_PORT | default .Values.service.ports.blockfrost }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.mesh .Values.environment.DINGO_MESH_PORT))) 0 }}
    - name: mesh
      port: {{ .Values.environment.DINGO_MESH_PORT | default .Values.service.ports.mesh }}
      targetPort: {{ .Values.environment.DINGO_MESH_PORT | default .Values.service.ports.mesh }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.kupo .Values.environment.DINGO_PLUGINS_API_KUPO_CONFIG_PORT))) 0 }}
    - name: kupo
      port: {{ .Values.environment.DINGO_PLUGINS_API_KUPO_CONFIG_PORT | default .Values.service.ports.kupo }}
      targetPort: {{ .Values.environment.DINGO_PLUGINS_API_KUPO_CONFIG_PORT | default .Values.service.ports.kupo }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.bark .Values.environment.DINGO_BARK_PORT))) 0 }}
    - name: bark
      port: {{ .Values.environment.DINGO_BARK_PORT | default .Values.service.ports.bark }}
      targetPort: {{ .Values.environment.DINGO_BARK_PORT | default .Values.service.ports.bark }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.midnight .Values.environment.DINGO_MIDNIGHT_PORT))) 0 }}
    - name: midnight
      port: {{ .Values.environment.DINGO_MIDNIGHT_PORT | default .Values.service.ports.midnight }}
      targetPort: {{ .Values.environment.DINGO_MIDNIGHT_PORT | default .Values.service.ports.midnight }}
{{- end }}
  selector:
    {{- include "dingo.matchLabels" . | nindent 4 }}
{{- end }}
