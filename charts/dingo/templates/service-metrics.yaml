{{- if .Values.service.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dingo.fullname" . }}-metrics
  labels:
    {{- include "dingo.labels" . | nindent 4 }}
    dingo.blinklabs.io/service-tier: private
  {{- if .Values.service.metrics.annotations }}
  annotations: {{- toYaml .Values.service.metrics.annotations | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP only. Metrics are never published externally by the chart.
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: {{ .Values.environment.CARDANO_METRICS_PORT | default .Values.service.ports.metrics }}
  selector:
    {{- include "dingo.matchLabels" . | nindent 4 }}
{{- end }}
