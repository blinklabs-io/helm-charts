{{- $availability := dict -}}
{{- if .Values.availability.enabled -}}
{{- $availability = include "dingo.availabilityConfig" . | fromJson -}}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dingo.fullname" . }}
  labels:
    {{- include "dingo.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "dingo.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  {{- if .Values.updateStrategy }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dingo.matchLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        kubectl.kubernetes.io/default-container: dingo
{{- if .Values.availability.enabled }}
        checksum/readiness: {{ .Files.Get "files/readiness.sh" | sha256sum }}
{{- end }}
{{- if and .Values.blockProducer.enabled (not .Values.blockProducer.existingSecret) }}
        checksum/keys: {{ .Values.blockProducer.keys | toJson | sha256sum }}
{{- end }}
{{- if .Values.blockProducer.enabled }}
{{- range $key, $value := .Values.blockProducer.podAnnotations }}
{{- if or (has $key (list "cluster-autoscaler.kubernetes.io/safe-to-evict" "kubectl.kubernetes.io/default-container")) (and (eq $key "checksum/keys") (not $.Values.blockProducer.existingSecret)) (and (eq $key "checksum/topology") $.Values.topology.enabled) (and (eq $key "checksum/readiness") $.Values.availability.enabled) }}
{{- fail (printf "blockProducer.podAnnotations key %q is already set by the chart" $key) }}
{{- end }}
        {{ $key }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
{{- if .Values.topology.enabled }}
        checksum/topology: {{ .Values.topology | toJson | sha256sum }}
{{- end }}
      labels:
        {{- include "dingo.labels" . | nindent 8 }}
{{- with .Values.extraPodLabels }}
{{ toYaml . | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ include "dingo.fullname" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- if .Values.availability.enabled }}
      terminationGracePeriodSeconds: {{ .Values.availability.terminationGracePeriodSeconds }}
{{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
{{- if .Values.affinity }}
      affinity: {{ .Values.affinity | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
{{- end }}
{{- if or .Values.mithril.enabled .Values.blockProducer.enabled }}
      initContainers:
{{- if .Values.blockProducer.enabled }}
      - name: prepare-block-producer-keys
        image: {{ include "dingo.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            umask 077
            for name in kes.skey vrf.skey node.cert{{ if include "dingo.blockProducer.blsEnabled" . }} bls.skey{{ end }}; do
              cp "/var/run/dingo-keys-source/$name" "/keys/$name"
              chmod 0600 "/keys/$name"
            done
        volumeMounts:
          - name: block-producer-keys-source
            mountPath: /var/run/dingo-keys-source
            readOnly: true
          - name: block-producer-keys
            mountPath: /keys
{{- end }}
{{- if .Values.mithril.enabled }}
      # Native Mithril bootstrap using dingo's built-in mithril sync
      - name: mithril-sync
        image: {{ include "dingo.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e

            if [ "$DEBUG_INIT" = "true" ]; then
              echo "DEBUG: Checking data directory..."
              ls -la {{ .Values.environment.CARDANO_DATABASE_PATH }} || true
            fi

            # Check if database already exists (skip sync if data present)
            if [ -f "{{ .Values.environment.CARDANO_DATABASE_PATH }}/metadata.sqlite" ] && [ "$FORCE_RESYNC" != "true" ]; then
              echo "Database already exists, skipping mithril sync"
              exit 0
            fi

            # Remove existing data if force resync is enabled
            if [ "$FORCE_RESYNC" = "true" ]; then
              echo "Force resync enabled, removing existing database..."
              rm -rf {{ .Values.environment.CARDANO_DATABASE_PATH }}/blob/* \
                     {{ .Values.environment.CARDANO_DATABASE_PATH }}/db/* \
                     {{ .Values.environment.CARDANO_DATABASE_PATH }}/metadata.sqlite* \
                     {{ .Values.environment.CARDANO_DATABASE_PATH }}/.mithril-cache/* 2>/dev/null || true
            fi

            echo "Starting native mithril sync..."
            echo "(This could take a while...)"

            # Run dingo mithril sync - handles download, load, and ledger catchup
            # Network, database path, and mithril config are picked up from env vars
            dingo mithril sync

            echo "Mithril sync complete"
        env:
          {{- range $key, $value := .Values.environment }}
          {{- if not (kindIs "invalid" $value) }}
          - name: {{ $key }}
            value: "{{ $value }}"
          {{- end }}
          {{- end }}
          {{- if .Values.mithril.aggregatorUrl }}
          - name: DINGO_MITHRIL_AGGREGATOR_URL
            value: {{ .Values.mithril.aggregatorUrl | quote }}
          {{- end }}
          {{- if .Values.mithril.downloadDir }}
          - name: DINGO_MITHRIL_DOWNLOAD_DIR
            value: {{ .Values.mithril.downloadDir | quote }}
          {{- end }}
          - name: DINGO_MITHRIL_CLEANUP
            value: {{ .Values.mithril.cleanupAfterLoad | quote }}
          - name: DINGO_MITHRIL_VERIFY_CERTS
            value: {{ .Values.mithril.verifyCertificates | quote }}
          - name: FORCE_RESYNC
            value: {{ .Values.mithril.forceResync | quote }}
          - name: DEBUG_INIT
            value: {{ .Values.mithril.debugInit | quote }}
        volumeMounts:
          - name: dingo-data
            mountPath: {{ .Values.environment.CARDANO_DATABASE_PATH }}
          - name: tmp
            mountPath: /tmp
        {{- if .Values.mithril.resources }}
        resources: {{- toYaml .Values.mithril.resources | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}
      containers:
      - name: dingo
        image: {{ include "dingo.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        env:
          {{- range $key, $value := .Values.environment }}
          {{- if and (not (kindIs "invalid" $value)) (not (and $.Values.service.private.enabled (eq $key "CARDANO_PRIVATE_BIND_ADDR"))) (not (has $key (list "CARDANO_PORT" "CARDANO_PRIVATE_PORT" "CARDANO_METRICS_PORT"))) (not (and $.Values.availability.enabled (has $key (list "DINGO_HEALTH_PORT" "DINGO_HEALTH_READY_GAP_SLOTS")))) }}
          - name: {{ $key }}
            value: "{{ $value }}"
          {{- end }}
          {{- end }}
          {{- /* Dingo binds these listeners from its own env vars only, so the
          Service and containerPort values must be passed through. */}}
          - name: CARDANO_PORT
            value: {{ .Values.environment.CARDANO_PORT | default .Values.service.ports.relay | quote }}
          - name: CARDANO_PRIVATE_PORT
            value: {{ .Values.environment.CARDANO_PRIVATE_PORT | default .Values.service.ports.private | quote }}
          - name: CARDANO_METRICS_PORT
            value: {{ .Values.environment.CARDANO_METRICS_PORT | default .Values.service.ports.metrics | quote }}
{{- if .Values.availability.enabled }}
          - name: DINGO_HEALTH_PORT
            value: {{ $availability.healthPort | quote }}
          - name: DINGO_HEALTH_READY_GAP_SLOTS
            value: {{ $availability.maxSlotLag | quote }}
{{- end }}
{{- if .Values.service.private.enabled }}
          - name: CARDANO_PRIVATE_BIND_ADDR
            value: {{ .Values.environment.CARDANO_PRIVATE_BIND_ADDR | default "0.0.0.0" | quote }}
{{- end }}
{{- if .Values.blockProducer.enabled }}
          - name: CARDANO_BLOCK_PRODUCER
            value: "true"
          - name: CARDANO_SHELLEY_KES_KEY
            value: "/keys/kes.skey"
          - name: CARDANO_SHELLEY_OPERATIONAL_CERTIFICATE
            value: "/keys/node.cert"
          - name: CARDANO_SHELLEY_VRF_KEY
            value: "/keys/vrf.skey"
{{- if include "dingo.blockProducer.blsEnabled" . }}
          - name: DINGO_LEIOS_VOTE_SIGNING_KEY_FILE
            value: "/keys/bls.skey"
{{- end }}
          - name: DINGO_FORGE_SYNC_TOLERANCE_SLOTS
            value: {{ .Values.blockProducer.forgeSyncToleranceSlots | quote }}
          - name: DINGO_FORGE_STALE_GAP_THRESHOLD_SLOTS
            value: {{ .Values.blockProducer.forgeStaleGapThresholdSlots | quote }}
          - name: DINGO_SLOTS_PER_KES_PERIOD
            value: {{ .Values.blockProducer.slotsPerKESPeriod | quote }}
          - name: DINGO_MAX_KES_EVOLUTIONS
            value: {{ .Values.blockProducer.maxKESEvolutions | quote }}
{{- end }}
{{- if .Values.topology.enabled }}
          - name: CARDANO_TOPOLOGY
            value: "/config/topology.json"
{{- end }}
{{- if .Values.availability.enabled }}
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - /readiness/readiness.sh
              - {{ $availability.healthPort | quote }}
              - {{ .Values.availability.requestTimeoutSeconds | quote }}
              - {{ $availability.blockfrostPort | quote }}
              - {{ $availability.blockfrostScheme | quote }}
              {{- range $availability.listenerPorts }}
              - {{ . | quote }}
              {{- end }}
          periodSeconds: {{ .Values.availability.periodSeconds }}
          timeoutSeconds: {{ $availability.timeoutSeconds }}
          failureThreshold: {{ .Values.availability.failureThreshold }}
          successThreshold: {{ .Values.availability.successThreshold }}
        {{- if gt (int .Values.availability.drainDelaySeconds) 0 }}
        lifecycle:
          preStop:
            sleep:
              seconds: {{ .Values.availability.drainDelaySeconds }}
        {{- end }}
{{- end }}
        ports:
          - name: relay
            containerPort: {{ .Values.environment.CARDANO_PORT | default .Values.service.ports.relay }}
            {{- with .Values.service.relay.hostPort }}
            hostPort: {{ . }}
            {{- end }}
          - name: private
            containerPort: {{ .Values.environment.CARDANO_PRIVATE_PORT | default .Values.service.ports.private }}
          - name: metrics
            containerPort: {{ .Values.environment.CARDANO_METRICS_PORT | default .Values.service.ports.metrics }}
{{- if gt (int (default "0" (default .Values.service.ports.utxorpc .Values.environment.DINGO_UTXORPC_PORT))) 0 }}
          - name: utxorpc
            containerPort: {{ .Values.environment.DINGO_UTXORPC_PORT | default .Values.service.ports.utxorpc }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.blockfrost .Values.environment.DINGO_BLOCKFROST_PORT))) 0 }}
          - name: blockfrost
            containerPort: {{ .Values.environment.DINGO_BLOCKFROST_PORT | default .Values.service.ports.blockfrost }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.mesh .Values.environment.DINGO_MESH_PORT))) 0 }}
          - name: mesh
            containerPort: {{ .Values.environment.DINGO_MESH_PORT | default .Values.service.ports.mesh }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.kupo .Values.environment.DINGO_PLUGINS_API_KUPO_CONFIG_PORT))) 0 }}
          - name: kupo
            containerPort: {{ .Values.environment.DINGO_PLUGINS_API_KUPO_CONFIG_PORT | default .Values.service.ports.kupo }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.bark .Values.environment.DINGO_BARK_PORT))) 0 }}
          - name: bark
            containerPort: {{ .Values.environment.DINGO_BARK_PORT | default .Values.service.ports.bark }}
{{- end }}
{{- if gt (int (default "0" (default .Values.service.ports.midnight .Values.environment.DINGO_MIDNIGHT_PORT))) 0 }}
          - name: midnight
            containerPort: {{ .Values.environment.DINGO_MIDNIGHT_PORT | default .Values.service.ports.midnight }}
{{- end }}
        volumeMounts:
          - name: dingo-data
            mountPath: {{ .Values.environment.CARDANO_DATABASE_PATH }}
          - name: tmp
            mountPath: /tmp
          - name: ipc
            mountPath: /ipc
{{- if .Values.availability.enabled }}
          - name: readiness
            mountPath: /readiness
            readOnly: true
{{- end }}
{{- if .Values.apiTLS.existingSecret }}
          - name: api-tls
            mountPath: /tls
            readOnly: true
{{- end }}
{{- if .Values.topology.enabled }}
          - name: topology
            mountPath: /config/topology.json
            subPath: topology.json
{{- end }}
{{- if .Values.blockProducer.enabled }}
          - name: block-producer-keys
            mountPath: /keys
            readOnly: true
{{- end }}
        {{- if .Values.resources }}
        resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- end }}
{{- if .Values.sidecars }}
{{ toYaml .Values.sidecars | nindent 6 }}
{{- end }}
      restartPolicy: Always
      volumes:
{{- if .Values.availability.enabled }}
      - name: readiness
        configMap:
          name: {{ include "dingo.fullname" . }}-readiness
{{- end }}
      - name: tmp
        emptyDir: {}
      - name: ipc
        emptyDir: {}
{{- if .Values.apiTLS.existingSecret }}
      - name: api-tls
        secret:
          secretName: {{ .Values.apiTLS.existingSecret | quote }}
          defaultMode: 0440
          items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
{{- end }}
{{- if .Values.topology.enabled }}
      - name: topology
        configMap:
          name: {{ include "dingo.fullname" . }}-topology
          defaultMode: 0644
{{- end }}
{{- if .Values.blockProducer.enabled }}
      - name: block-producer-keys
        emptyDir:
          medium: Memory
      - name: block-producer-keys-source
        secret:
          defaultMode: 0600
          secretName: {{ include "dingo.blockProducer.keysSecretName" . }}
{{- if .Values.blockProducer.existingSecret }}
          items:
          - key: {{ .Values.blockProducer.kesKey | quote }}
            path: kes.skey
          - key: {{ .Values.blockProducer.opCertKey | quote }}
            path: node.cert
          - key: {{ .Values.blockProducer.vrfKey | quote }}
            path: vrf.skey
{{- if .Values.blockProducer.blsKey }}
          - key: {{ .Values.blockProducer.blsKey | quote }}
            path: bls.skey
{{- end }}
{{- end }}
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: dingo-data
        labels:
          cardano_network: {{ include "dingo.network" . }}
      spec:
        accessModes:
        - {{ .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
