# CI test values for chart-testing (rendered-manifest test: legacy upgrade path).
#
# Simulates an existing release that used the pre-split flat `service.type`
# interface with a LoadBalancer. On upgrade, the backward-compatibility Service
# (same `<release>-dingo` name) must inherit that type so external reachability
# and the cloud load balancer are preserved without manual migration.
#
# CI only; not a production configuration.

mithril:
  enabled: false

# Legacy flat interface as an existing consumer would still have it set.
service:
  type: LoadBalancer
  sessionAffinity: ClientIP
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
