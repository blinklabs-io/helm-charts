# chart-testing values: existing Secret whose data keys differ from the file
# names dingo expects, plus a rotation annotation. The items mapping must
# project each key to its fixed file name under /keys, and the numeric
# annotation value must render as a string.
blockProducer:
  enabled: true
  existingSecret: dingo-ci-block-producer-keys
  kesKey: kes-skey
  opCertKey: opcert
  vrfKey: vrf-skey
  podAnnotations:
    checksum/keys: 0123456789abcdef
    example.com/kes-period: 42
