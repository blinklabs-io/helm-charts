---
replicaCount: 1

updateStrategy:
  type: RollingUpdate

image:
  repository: ghcr.io/blinklabs-io/dingo
  tag: "0.70.6"
  # Optional immutable image digest. When set, the container is referenced by
  # digest (repository@sha256:...) instead of the mutable tag, so a deployment
  # pins the exact image content regardless of tag changes. When empty, the
  # tag above is used. See README.md for provenance and SBOM verification.
  # digest: "sha256:..."
  digest: ""
  pullPolicy: IfNotPresent

# Do not automount the ServiceAccount API token. Dingo never talks to the
# Kubernetes API, so the token is unnecessary and omitting it reduces the blast
# radius if the pod is compromised.
automountServiceAccountToken: false

# Pod-level security context. Dingo runs as the non-root "dingo" user baked into
# the upstream image (UID 1000 / GID 1000), pinned numerically so kubelet can
# enforce runAsNonRoot without resolving the image's /etc/passwd. fsGroup makes
# the mounted PVC group-owned by the dingo user on first mount.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. Locked down by default: no privilege
# escalation, read-only root filesystem, and all Linux capabilities dropped.
# Writable scratch paths (/tmp and the /ipc socket dir) are provided via
# emptyDir mounts so the read-only root filesystem does not break the node.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# Native Mithril snapshot bootstrap via dingo's built-in mithril sync
# Uses dingo's native Go Mithril client (no external mithril-client binary needed)
mithril:
  enabled: true
  # Aggregator URL is auto-detected from network name when empty
  # Mainnet: https://aggregator.release-mainnet.api.mithril.network/aggregator
  # Preprod: https://aggregator.release-preprod.api.mithril.network/aggregator
  # Preview: https://aggregator.pre-release-preview.api.mithril.network/aggregator
  aggregatorUrl: ""
  # Download directory for mithril snapshot (default: <databasePath>/.mithril-cache)
  downloadDir: ""
  # Cleanup temp files after loading snapshot
  cleanupAfterLoad: true
  # Verify mithril certificate chain
  verifyCertificates: true
  # Force re-sync even if database already exists
  # WARNING: This will delete existing database data
  forceResync: false
  # Enable debug logging in init container
  debugInit: false
  # Resource limits for the mithril init container
  resources: {}
    # limits:
    #   cpu: 2
    #   memory: 4Gi
    # requests:
    #   cpu: 1
    #   memory: 2Gi

# Block producer (SPO) configuration
# Requires KES signing key, VRF signing key, and operational certificate
blockProducer:
  enabled: false
  # Forging sync tolerance - skip forging if more than this many slots behind tip
  forgeSyncToleranceSlots: 100
  # Slot gap threshold that triggers stale database warning
  forgeStaleGapThresholdSlots: 1000
  # KES period configuration (should match network genesis parameters)
  slotsPerKESPeriod: 129600
  maxKESEvolutions: 62
  # Block producer keys - stored as a Kubernetes Secret
  # Generate keys using cardano-cli and provide in the same JSON format
#  keys:
#    - name: kes.skey
#      type: KesSigningKey_ed25519_kes_2^6
#      description: KES Signing Key
#      cborHex: ""
#    - name: node.cert
#      type: NodeOperationalCertificate
#      description: ""
#      cborHex: ""
#    - name: vrf.skey
#      type: VrfSigningKey_PraosVRF
#      description: VRF Signing Key
#      cborHex: ""

# Custom P2P topology configuration
# When disabled, dingo uses built-in bootstrap peers for the configured network
topology:
  enabled: false
#  bootstrapPeers:
#    - address: preview-node.play.dev.cardano.org
#      port: 3001
#  localRoots:
#    - accessPoints:
#        - name: Example
#          address: preview-node.play.dev.cardano.org
#          port: 3001
#      advertise: false
#      trustable: true
#      valency: 1
#  publicRoots:
#    - accessPoints:
#        - name: Example
#          address: preview-node.play.dev.cardano.org
#          port: 3001
#      advertise: true
#  # useLedgerAfterSlot: -1 to disable ledger peer discovery
#  useLedgerAfterSlot: 83116868

# Environment variables passed directly to the dingo container
# Dingo reads CARDANO_* and DINGO_* environment variables
# See https://github.com/blinklabs-io/dingo for full list
environment:
  CARDANO_NETWORK: "preview"
  CARDANO_DATABASE_PATH: "/data"
  # Core node settings
  # CARDANO_BIND_ADDR: "0.0.0.0"
  # CARDANO_CONFIG: ""
  # CARDANO_SOCKET_PATH: "dingo.socket"
  # CARDANO_PORT: "3001"
  # CARDANO_PRIVATE_BIND_ADDR: "127.0.0.1"
  # CARDANO_PRIVATE_PORT: "3002"
  # CARDANO_METRICS_PORT: "12798"
  # CARDANO_TOPOLOGY: ""
  # CARDANO_INTERSECT_TIP: "false"
  # CARDANO_VALIDATE_HISTORICAL: "false"
  # CARDANO_SHUTDOWN_TIMEOUT: "30s"
  # CARDANO_MEMPOOL_CAPACITY: "1048576"
  #
  # Run/storage mode
  # DINGO_RUN_MODE: "serve"           # serve, load, dev, leios
  # DINGO_STORAGE_MODE: "core"        # core or api (api required for blockfrost/mesh/utxorpc)
  #
  # API ports (0 = disabled, requires storageMode=api)
  # DINGO_UTXORPC_PORT: "0"
  # DINGO_BLOCKFROST_PORT: "0"
  # DINGO_MESH_PORT: "0"
  #
  # TLS for UTxO RPC gRPC
  # TLS_CERT_FILE_PATH: ""
  # TLS_KEY_FILE_PATH: ""
  #
  # Peer targeting
  # DINGO_TARGET_KNOWN_PEERS: "150"
  # DINGO_TARGET_ESTABLISHED_PEERS: "50"
  # DINGO_TARGET_ACTIVE_PEERS: "20"
  # DINGO_ACTIVE_PEERS_TOPOLOGY_QUOTA: "3"
  # DINGO_ACTIVE_PEERS_GOSSIP_QUOTA: "12"
  # DINGO_ACTIVE_PEERS_LEDGER_QUOTA: "5"
  #
  # Chainsync
  # DINGO_CHAINSYNC_MAX_CLIENTS: "3"
  # DINGO_CHAINSYNC_STALL_TIMEOUT: "2m"
  #
  # Cache tuning
  # DINGO_CACHE_HOT_UTXO_ENTRIES: "50000"
  # DINGO_CACHE_HOT_TX_ENTRIES: "10000"
  # DINGO_CACHE_HOT_TX_MAX_BYTES: "268435456"
  # DINGO_CACHE_BLOCK_LRU_ENTRIES: "500"
  # DINGO_CACHE_WARMUP_BLOCKS: "1000"
  # DINGO_CACHE_WARMUP_SYNC: "true"
  #
  # Mempool
  # DINGO_MEMPOOL_EVICTION_WATERMARK: "0.90"
  # DINGO_MEMPOOL_REJECTION_WATERMARK: "0.95"
  #
  # Ledger
  # DINGO_LEDGER_CATCHUP_TIMEOUT: "30m"
  #
  # Database plugins
  # DINGO_DATABASE_METADATA_PLUGIN: "sqlite"    # sqlite, postgres, mysql
  # DINGO_DATABASE_BLOB_PLUGIN: "badger"        # badger, s3, gcs
  # DINGO_DATABASE_WORKERS: "5"
  # DINGO_DATABASE_QUEUE_SIZE: "50"
  #
  # Bark notification
  # DINGO_BARK_BASE_URL: ""
  # DINGO_BARK_SECURITY_WINDOW: "10000"
  # DINGO_BARK_PORT: "0"

resources: {}
  # limits:
  #   cpu: 2
  #   memory: 8Gi
  # requests:
  #   cpu: 1
  #   memory: 4Gi

tolerations: []

affinity: {}

# extraPodLabels: {}

persistence:
  accessMode: ReadWriteOnce
  size: 60Gi
  # storageClass: "hyperdisk-balanced"

# Service exposure is intentionally split so public relay (P2P) traffic is
# separated from the private node API and metrics. Only the relay Service is
# meant to be published externally; the private and metrics Services are
# ClusterIP-only and are never exposed by this chart. Restrict access to the
# private endpoints with a NetworkPolicy (see networkPolicy below) or front
# them with an authenticated ingress/gateway.
service:
  # Canonical container port numbers, shared by the StatefulSet container ports
  # and the Service definitions below.
  ports:
    relay: 3001
    private: 3002
    metrics: 12798
    # API ports - only exposed when non-zero AND the matching DINGO_*_PORT
    # environment variable is set. These are private (served by the private
    # Service), never by the public relay Service.
    utxorpc: 0
    blockfrost: 0
    mesh: 0
  # Public P2P relay Service. This is the ONLY Service intended for external
  # exposure. Defaults to ClusterIP; set type to LoadBalancer or NodePort to
  # publish the relay port. It never carries the private API or metrics ports.
  relay:
    type: ClusterIP
    sessionAffinity: ClientIP
    annotations: {}
    # The following only apply to NodePort / LoadBalancer service types.
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    nodePort: ""
  # Private Service: node private API plus optional local APIs (UTxO RPC,
  # Blockfrost, Mesh). ClusterIP-only and never published externally.
  private:
    enabled: true
    sessionAffinity: ClientIP
    annotations: {}
  # Metrics Service (Prometheus text on /metrics). ClusterIP-only.
  metrics:
    enabled: true
    annotations: {}

# Optional NetworkPolicy. When enabled, the public relay port stays open to all
# sources while ingress to the private API and metrics ports is restricted to
# the peers listed below. Pair this with an authenticated ingress if the
# private endpoints must be reachable from outside the cluster.
networkPolicy:
  enabled: false
  # Sources allowed to reach the private API ports (private / utxorpc /
  # blockfrost / mesh). Standard NetworkPolicy peer objects.
  privateIngressFrom: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: my-app-namespace
    # - podSelector:
    #     matchLabels:
    #       app.kubernetes.io/name: my-client
  # Sources allowed to reach the metrics port (e.g. your Prometheus).
  metricsIngressFrom: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: monitoring

serviceAccount:
  annotations: {}

# Enable PodMonitor for Prometheus Operator
podMonitor:
  enabled: false
  # extraLabels: {}
  # Promote pod labels to Prometheus metric labels
  # podTargetLabels: []
  # Required for Prometheus >= v3.0.0
  fallbackScrapeProtocol: "PrometheusText0.0.4"
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s

# Inject arbitrary sidecar containers
# sidecars: []
