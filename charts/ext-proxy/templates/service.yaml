{{- if .Values.proxyService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.proxyService.name | replace "_" "-" }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.proxyService.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.proxyService.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
{{- $spec := deepCopy .Values.proxyService.spec }}
{{- $selector := default (dict) (get $spec "selector") }}
{{- $_ := set $selector "role" .Values.proxy.role }}
{{- $_ := set $spec "selector" $selector }}
spec: {{ toYaml $spec | nindent 2 }}
{{- end }}
