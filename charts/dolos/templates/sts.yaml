{{- if .Values.availability.enabled }}
{{- if le (int .Values.availability.maxCheckAgeSeconds) (int .Values.availability.pollIntervalSeconds) }}
{{- fail "availability.maxCheckAgeSeconds must exceed pollIntervalSeconds" }}
{{- end }}
{{- $listenerPorts := list (int .Values.ports.grpc) (int .Values.ports.minibf) (int .Values.ports.minikupo) (int .Values.ports.ouroboros) }}
{{- if has (int .Values.availability.port) $listenerPorts }}
{{- fail "availability.port must not conflict with an API or Ouroboros port" }}
{{- end }}
{{- if hasKey .Values.podLabels "dolos.blinklabs.io/serving" }}
{{- fail "dolos.blinklabs.io/serving is managed by availability; do not set it in podLabels" }}
{{- end }}
{{- if empty .Values.availability.referenceTipURLs }}
{{- fail "availability.referenceTipURLs requires at least one reference relay metrics URL" }}
{{- end }}
{{- if and (gt (int .Values.availability.drainDelaySeconds) 0) (not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version)) }}
{{- fail "availability.drainDelaySeconds requires Kubernetes 1.30 or newer; set it to zero to omit native lifecycle sleep" }}
{{- end }}
{{- if ge (int .Values.availability.drainDelaySeconds) (int .Values.terminationGracePeriodSeconds) }}
{{- fail "terminationGracePeriodSeconds must exceed availability.drainDelaySeconds" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "dolos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    cardano.demeter.run/network: {{ .Values.network }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  serviceName: {{ .Values.service.name | default .Release.Name }}
  {{- if .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "dolos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
          {{ toYaml .Values.podAnnotations | nindent 4 }}
        {{- end }}
      labels: {{- include "dolos.selectorLabels" . | nindent 8 -}}
        {{- if .Values.availability.enabled }}
        dolos.blinklabs.io/serving: "true"
        {{- end }}
        {{- if .Values.podLabels }}
          {{- toYaml .Values.podLabels | nindent 8 -}}
        {{- end }}
    spec:
      {{- if .Values.availability.enabled }}
      automountServiceAccountToken: false
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.tolerations }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
        - name: dolos-ipc
          emptyDir: {}
      initContainers:
        - name: init
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -c
            - /etc/config/dolos.toml
            - bootstrap
            - --skip-if-data
            - snapshot
            - --variant
            - full
          {{- with .Values.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/config
            - name: data
              mountPath: /var/data
            - name: dolos-ipc
              mountPath: /ipc
      containers:
        - name: dolos
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -c
            - /etc/config/dolos.toml
            - daemon
          {{- if and .Values.availability.enabled (gt (int .Values.availability.drainDelaySeconds) 0) }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.availability.drainDelaySeconds }}
          {{- end }}
          {{- with .Values.env }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/config
            - name: data
              mountPath: /var/data
            - name: dolos-ipc
              mountPath: /ipc
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
              protocol: TCP
            - name: minibf
              containerPort: {{ .Values.ports.minibf }}
              protocol: TCP
            {{- if and .Values.ports.minikupo .Values.service.ports.minikupo }}
            - name: minikupo
              containerPort: {{ .Values.ports.minikupo }}
              protocol: TCP
            {{- end }}
        {{- if .Values.availability.enabled }}
        - name: availability
          {{- if .Values.availability.image.digest }}
          image: {{ printf "%s@%s" .Values.availability.image.repository .Values.availability.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.availability.image.repository .Values.availability.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.availability.image.pullPolicy }}
          command: ["python3", "-B", "/etc/config/readiness.py", "/etc/config/readiness.json"]
          ports:
            - name: availability
              containerPort: {{ .Values.availability.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: availability
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: availability
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.availability.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
        {{- end }}
        - name: socat-ntc
          image: "{{ .Values.socat.image.repository }}:{{ .Values.socat.image.tag }}"
          imagePullPolicy: {{ .Values.socat.image.pullPolicy | default "IfNotPresent" }}
          {{- if and .Values.availability.enabled (gt (int .Values.availability.drainDelaySeconds) 0) }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.availability.drainDelaySeconds }}
          {{- end }}
          command:
            - socat
            - TCP-LISTEN:{{ .Values.ports.ouroboros }},fork
            - UNIX-CLIENT:/ipc/dolos.socket,ignoreeof
          ports:
            - name: socat-ntc
              containerPort: {{ .Values.ports.ouroboros }}
          resources:
            {{- toYaml .Values.socat.resources | nindent 12 }}
          volumeMounts:
            - name: dolos-ipc
              mountPath: /ipc
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{- end }}
