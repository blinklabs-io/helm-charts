{{- $enabled := list }}
{{- range $name, $node := .Values.nodes }}
{{- if ne $node.enabled false }}
{{- $enabled = append $enabled $name }}
{{- end }}
{{- end }}
{{- $policyName := printf "%s-metrics" .Release.Name }}
{{- /* The operator names each node's own NetworkPolicy after the node, so a
node with this name would make the two objects collide. Checked even while
from is empty or the node is disabled, so the collision cannot appear later. */}}
{{- if and .Values.metricsNetworkPolicy.enabled (hasKey .Values.nodes $policyName) }}
{{- fail (printf "nodes.%s: the name is reserved for the release's metrics NetworkPolicy; rename the node or set metricsNetworkPolicy.enabled=false" $policyName) }}
{{- end }}
{{- /* An empty from would admit every peer, so render nothing without one. */}}
{{- if and .Values.metricsNetworkPolicy.enabled $enabled .Values.metricsNetworkPolicy.from }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $policyName | quote }}
  labels:
    {{- include "dingonodes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [dingo]
      - key: app.kubernetes.io/instance
        operator: In
        values:
          {{- range $enabled }}
          - {{ . | quote }}
          {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.metricsNetworkPolicy.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: 12798
{{- end }}
