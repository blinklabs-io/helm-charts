mode: signer
signer:
  config:
    signer:
      require_client_cert: false
      watermark:
        type: postgres
        dsn_env: SIGNER_WATERMARK_DSN
      backends:
        - name: cold
          type: sops
          path: /etc/bursa/signer/sops-keys
      callers:
        - subject: dingo-operator
          keys: ["00000000000000000000000000000000000000000000000000000000"]
      keys:
        - hash: "00000000000000000000000000000000000000000000000000000000"
          backend: cold
          allowed_requests: ["opcert"]
  tls:
    secretName: bursa-signer-tls
    clientCASecretName: bursa-signer-client-ca
  sopsKeys:
    secretName: bursa-signer-cold-keys
  ageKey:
    secretName: bursa-signer-age
  extraVolumes:
    - name: host-key-secret
      secret:
        secretName: bursa-signer-host-key
    - name: host-key
      emptyDir:
        medium: Memory
  extraVolumeMounts:
    - {name: host-key, mountPath: /etc/bursa/signer/host-key, readOnly: true}
  extraEnv:
    - name: SIGNER_WATERMARK_DSN
      valueFrom:
        secretKeyRef:
          name: bursa-signer-watermark
          key: dsn
  networkPolicy:
    enabled: true
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: dingo-operator
replicaCount: 2
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      # chart-testing generates release names, so select on the chart name;
      # a real release also matches app.kubernetes.io/instance: <release>
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: bursa
        topologyKey: kubernetes.io/hostname
podDisruptionBudget:
  enabled: true
initContainers:
  - name: host-key
    image: busybox:1.36
    command: ["sh", "-c", "install -m 0400 /secret/host.skey /keys/host.skey"]
    securityContext:
      runAsUser: 65532
    volumeMounts:
      - {name: host-key-secret, mountPath: /secret, readOnly: true}
      - {name: host-key, mountPath: /keys}
