replicaCount: 1

updateStrategy:
  type: RollingUpdate

image:
  repository: ghcr.io/blinklabs-io/bursa
  tag: "0.16.0"
  pullPolicy: IfNotPresent

environment:
  CARDANO_NETWORK: "mainnet"
  # The API is loopback-only by default. Set this explicitly to a pod-reachable
  # address (for example, 0.0.0.0) only when api.auth is configured below.
  API_LISTEN_ADDRESS: "127.0.0.1"
  API_LISTEN_PORT: 8080
  # Optional API authentication settings. API_JWT_SECRET must be provided by
  # api.auth.existingSecret; it must not be placed in this map.
  # API_JWT_ISSUER: ""
  # API_JWT_AUDIENCE: ""
  # API_JWKS_URL: ""
  # Other optional variables.
  # GOOGLE_PROJECT: ""
  # GCP_KMS_RESOURCE_ID: ""
  # GCP_SECRET_PREFIX: ""
  # LOGGING_LEVEL: "info"
  # METRICS_LISTEN_ADDRESS: ""
  # METRICS_LISTEN_PORT: 8081

api:
  auth:
    # Name of an existing Secret containing the JWT secret. The chart never
    # accepts the secret value directly. The application enforces a minimum
    # secret length of 32 bytes at startup.
    existingSecret: ""
    existingSecretKey: "API_JWT_SECRET"

extraPodLabels: {}

podMonitor:
  enabled: false
  extraLabels: {}
  podTargetLabels: []
  podMetricsEndpoints: []

service:
  annotations: {}
  type: ClusterIP
  ports:
    api: 8080
    metrics: 8081

serviceAccount:
  name: kms-sa
  annotations: {}
    # iam.gke.io/gcp-service-account: bursa-sa@example-google-project.iam.gserviceaccount.com

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

tolerations: []
