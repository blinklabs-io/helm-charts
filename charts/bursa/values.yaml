replicaCount: 1

updateStrategy:
  type: RollingUpdate
  # Optional maxSurge and maxUnavailable for RollingUpdate. With required
  # pod anti-affinity and one node per replica, maxSurge 0 and
  # maxUnavailable 1 let the rollout proceed without a spare node.
  # rollingUpdate:
  #   maxSurge: 0
  #   maxUnavailable: 1

image:
  repository: ghcr.io/blinklabs-io/bursa
  tag: "0.24.0"
  pullPolicy: IfNotPresent

environment:
  CARDANO_NETWORK: "mainnet"
  # Optional variables. Uncomment and set to use.
  # API_LISTEN_ADDRESS: ""
  # API_LISTEN_PORT: 8080
  # GOOGLE_PROJECT: ""
  # GCP_KMS_RESOURCE_ID: ""
  # GCP_SECRET_PREFIX: ""
  # LOGGING_LEVEL: "info"
  # Metrics bind to loopback only; Bursa refuses a non-loopback
  # METRICS_LISTEN_ADDRESS.
  # METRICS_LISTEN_ADDRESS: "127.0.0.1"
  # METRICS_LISTEN_PORT: 8081

extraPodLabels: {}

# Must stay disabled: Bursa serves metrics on loopback only, so a pod scrape
# cannot reach them and the chart refuses to render with enabled: true.
podMonitor:
  enabled: false
  extraLabels: {}
  podTargetLabels: []
  podMetricsEndpoints: []

service:
  annotations: {}
  type: ClusterIP
  ports:
    api: 8080
    metrics: 8081
    signer: 8090
    kesAgent: 9443

serviceAccount:
  name: kms-sa
  annotations: {}
    # iam.gke.io/gcp-service-account: bursa-sa@example-google-project.iam.gserviceaccount.com

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

tolerations: []

affinity: {}
# Example: spread replicas across nodes
# affinity:
#   podAntiAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       - labelSelector:
#           matchLabels:
#             app.kubernetes.io/name: bursa
#             app.kubernetes.io/instance: <release>
#         topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# Init containers, passed through. The signer refuses a secret key file with
# group or other access, and a Secret volume under the signer's fsGroup is
# group-readable, so a key the signer reads with that check (such as an
# armory host_key_file) can be copied to an emptyDir with mode 0400 first.
initContainers: []
# Example, with signer.extraVolumes holding the Secret and an emptyDir:
# initContainers:
#   - name: host-key
#     image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
#     command: ["sh", "-c", "install -m 0400 /secret/host.skey /keys/host.skey"]
#     securityContext:
#       runAsUser: 65532
#       allowPrivilegeEscalation: false
#       readOnlyRootFilesystem: true
#       capabilities:
#         drop: ["ALL"]
#     volumeMounts:
#       - {name: host-key-secret, mountPath: /secret, readOnly: true}
#       - {name: host-key, mountPath: /keys}

# mode selects the bursa daemon: "api" (wallet API), "signer" (remote
# signer, `bursa signer`) or "kes-agent" (KES agent in sign mode,
# `bursa kes-agent`). The environment, serviceAccount and resources values
# apply to every mode; the api-only ports and podMonitor do not apply to the
# signer or the KES agent.
mode: api

signer:
  # Port of the signer HTTPS API, which also serves /healthz and /readyz.
  port: 8090
  # /readyz writes the counter watermark, so a postgres watermark in another
  # zone needs more than the kubelet's 1s default.
  probes:
    timeoutSeconds: 5
  # Contents of the signer config file. The chart sets signer.listen_address,
  # signer.listen_port and the TLS file paths; everything else is passed
  # through, except credentials: rendering fails if mnemonic, api.jwt_secret,
  # storage.dsn, signer.jwt_secret or signer.watermark.dsn is set, because
  # the file is a ConfigMap. Supply those through extraEnv with valueFrom
  # (watermark: dsn_env). URL userinfo is Basic authentication to Bursa's HTTP
  # clients, so rendering also fails if signer.policy_hook_url,
  # signer.jwks_url, api.jwks_url or a backend's address or jwks_url carries
  # it, or if SIGNER_POLICY_HOOK_URL, SIGNER_JWKS_URL, API_JWKS_URL or their
  # BURSA_SIGNER_SIGNER_ / BURSA_API_ prefixed names carry it as a literal
  # value. Supply the first three through extraEnv with valueFrom; backend
  # URLs have no environment override. Key backends and the per-key policy are configured here. A sops
  # backend reading the keys Secret below uses
  # `path: /etc/bursa/signer/sops-keys`. The signer serves metrics on
  # loopback only, so podMonitor cannot be used in signer mode.
  config: {}
    # signer:
    #   client_ca_cert is set by the chart when tls.clientCASecretName is set.
    #   require_client_cert: false   # true breaks the kubelet HTTPS probes
    #   watermark:   # a file watermark needs a persistent extraVolume
    #     type: postgres
    #     dsn_env: SIGNER_WATERMARK_DSN
    #   backends:
    #     - name: cold
    #       type: sops
    #       path: /etc/bursa/signer/sops-keys
    #   callers:   # subject = client cert URI SAN, else DNS SAN, else CN
    #     - subject: dingo-operator
    #       keys: ["<cold key hash>"]
    #   keys:
    #     - hash: "<cold key hash>"
    #       backend: cold
    #       allowed_requests: ["opcert"]
  tls:
    # kubernetes.io/tls Secret with the server certificate (tls.crt, tls.key).
    # Required: the signer refuses a plaintext non-loopback listener.
    secretName: ""
    # Secret holding the CA (ca.crt) that verifies client certificates.
    # Setting it enables mTLS client authentication.
    clientCASecretName: ""
  sopsKeys:
    # Secret of SOPS-encrypted *.json key files, mounted read-only at
    # /etc/bursa/signer/sops-keys. Each key must be a file name the signer
    # serves: *.json, not starting with a dot.
    secretName: ""
  ageKey:
    # Secret holding an age identity for SOPS decryption, exposed to the
    # signer through SOPS_AGE_KEY_FILE.
    secretName: ""
    key: keys.txt
  # Extra environment, e.g. SIGNER_WATERMARK_DSN from a secretKeyRef.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  networkPolicy:
    # Admit ingress to the signer port only from these peers
    # (NetworkPolicyPeer list).
    enabled: false
    from: []
    egress:
      # Also restrict egress (requires networkPolicy.enabled). The signer
      # reaches only its watermark database, custody backends and DNS.
      enabled: false
      # Allow DNS to kube-dns in kube-system.
      dns: true
      # NetworkPolicyEgressRule list, e.g.
      # - to:
      #     - namespaceSelector:
      #         matchLabels:
      #           kubernetes.io/metadata.name: postgres
      #       podSelector:
      #         matchLabels:
      #           cnpg.io/cluster: pg
      #   ports:
      #     - {port: 5432, protocol: TCP}
      # - to:
      #     - ipBlock: {cidr: 100.64.0.10/32}
      #   ports:
      #     - {port: 18480, protocol: TCP}
      to: []

kesAgent:
  # Port of the remote sign listener (bursa-attested-kes/1) that Dingo
  # producers connect to. The Service exposes it as service.ports.kesAgent.
  port: 9443
  # Loopback metrics listener, which also serves /healthz and /readyz. The
  # readiness probe runs `bursa kes-agent ready`, which queries it, so it
  # cannot be 0.
  metricsPort: 8082
  probes:
    # The agent answers /readyz within 3s and the ready command waits 5s.
    timeoutSeconds: 6
  # Contents of the kes-agent config file. The chart sets kes_agent.mode
  # (sign), the socket paths, attested_listen_address, the TLS file paths,
  # store.age_identity_file (from ageIdentity below) and the metrics
  # listener; everything else is passed through. Only sign mode is supported:
  # serve-key pushes the key over a Unix socket, which cannot reach a
  # producer in another pod. The control socket stays inside the pod.
  #
  # The guard must survive a restart, or the agent could sign a second
  # header for a slot it already signed, so the chart requires the shared
  # PostgreSQL store (store.type postgres) and refuses guard_file. The DSN is
  # read only from the variable store.dsn_env names: set that variable in
  # extraEnv with valueFrom.
  #
  # One release can serve several pools: list a profile per pool. From bursa
  # 0.24.0, each remote session selects one profile when it is admitted and
  # signs only for that profile.
  config: {}
    # kes_agent:
    #   attestation_provider: none
    #   store:
    #     type: postgres
    #     dsn_env: KESAGENT_PG_DSN
    #     age_recipients: ["age1..."]   # every replica's identity
    #   profiles:
    #     - name: preview-pool
    #       cold_vkey_hex: "<cold verification key, hex>"
    #       system_start: "2022-10-25T00:00:00Z"
    #       slots_per_kes_period: 129600
  # The agent reads its TLS key and age identity as secret key files: it
  # refuses a symlink, which is how a Secret volume presents each key, and
  # any group or other access, which a Secret volume under the pod's fsGroup
  # grants. An init container running copyImage therefore copies them, with
  # the certificate so the pair stays matched, to a memory emptyDir with mode
  # 0400. The copies and the config checksum do not follow a Secret update:
  # restart the Deployment after rotating the TLS or age Secret.
  copyImage: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  tls:
    # kubernetes.io/tls Secret with the listener certificate (tls.crt,
    # tls.key). Without it, set kes_agent.attested_plaintext: true in config
    # and provide transport security elsewhere.
    secretName: ""
    # Secret holding the CA (ca.crt) that issues producer client
    # certificates. Setting it makes the listener require one.
    clientCASecretName: ""
  ageIdentity:
    # Secret holding this release's age identity, which unseals the shared
    # KES key (store.age_recipients must list its recipient).
    secretName: ""
    key: identity.txt
  # Extra environment, e.g. the store DSN from a secretKeyRef.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
