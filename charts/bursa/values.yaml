replicaCount: 1

updateStrategy:
  type: RollingUpdate
  # Optional maxSurge and maxUnavailable for RollingUpdate. With required
  # pod anti-affinity and one node per replica, maxSurge 0 and
  # maxUnavailable 1 let the rollout proceed without a spare node.
  # rollingUpdate:
  #   maxSurge: 0
  #   maxUnavailable: 1

image:
  repository: ghcr.io/blinklabs-io/bursa
  tag: "0.20.0"
  pullPolicy: IfNotPresent

environment:
  CARDANO_NETWORK: "mainnet"
  # Optional variables. Uncomment and set to use.
  # API_LISTEN_ADDRESS: ""
  # API_LISTEN_PORT: 8080
  # GOOGLE_PROJECT: ""
  # GCP_KMS_RESOURCE_ID: ""
  # GCP_SECRET_PREFIX: ""
  # LOGGING_LEVEL: "info"
  # METRICS_LISTEN_ADDRESS: ""
  # METRICS_LISTEN_PORT: 8081

extraPodLabels: {}

podMonitor:
  enabled: false
  extraLabels: {}
  podTargetLabels: []
  podMetricsEndpoints: []

service:
  annotations: {}
  type: ClusterIP
  ports:
    api: 8080
    metrics: 8081
    signer: 8090

serviceAccount:
  name: kms-sa
  annotations: {}
    # iam.gke.io/gcp-service-account: bursa-sa@example-google-project.iam.gserviceaccount.com

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

tolerations: []

affinity: {}
# Example: spread replicas across nodes
# affinity:
#   podAntiAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       - labelSelector:
#           matchLabels:
#             app.kubernetes.io/name: bursa
#             app.kubernetes.io/instance: <release>
#         topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# Init containers, passed through. The signer refuses a secret key file with
# group or other access, and a Secret volume under the signer's fsGroup is
# group-readable, so a key the signer reads with that check (such as an
# armory host_key_file) can be copied to an emptyDir with mode 0400 first.
initContainers: []
# Example, with signer.extraVolumes holding the Secret and an emptyDir:
# initContainers:
#   - name: host-key
#     image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
#     command: ["sh", "-c", "install -m 0400 /secret/host.skey /keys/host.skey"]
#     securityContext:
#       runAsUser: 65532
#       allowPrivilegeEscalation: false
#       readOnlyRootFilesystem: true
#       capabilities:
#         drop: ["ALL"]
#     volumeMounts:
#       - {name: host-key-secret, mountPath: /secret, readOnly: true}
#       - {name: host-key, mountPath: /keys}

# mode selects the bursa daemon: "api" (wallet API) or "signer" (remote
# signer, `bursa signer`). The environment, serviceAccount and resources
# values apply to both; the api-only ports and podMonitor do not apply to
# the signer.
mode: api

signer:
  # Port of the signer HTTPS API, which also serves /healthz and /readyz.
  port: 8090
  # /readyz writes the counter watermark, so a postgres watermark in another
  # zone needs more than the kubelet's 1s default.
  probes:
    timeoutSeconds: 5
  # Contents of the signer config file. The chart sets signer.listen_address,
  # signer.listen_port and the TLS file paths; everything else is passed
  # through. Key backends and the per-key policy are configured here. A sops
  # backend reading the keys Secret below uses
  # `path: /etc/bursa/signer/sops-keys`. The signer serves metrics on
  # loopback only, so podMonitor cannot be used in signer mode.
  config: {}
    # signer:
    #   client_ca_cert is set by the chart when tls.clientCASecretName is set.
    #   require_client_cert: false   # true breaks the kubelet HTTPS probes
    #   watermark:   # a file watermark needs a persistent extraVolume
    #     type: postgres
    #     dsn_env: SIGNER_WATERMARK_DSN
    #   backends:
    #     - name: cold
    #       type: sops
    #       path: /etc/bursa/signer/sops-keys
    #   callers:   # subject = client cert URI SAN, else DNS SAN, else CN
    #     - subject: dingo-operator
    #       keys: ["<cold key hash>"]
    #   keys:
    #     - hash: "<cold key hash>"
    #       backend: cold
    #       allowed_requests: ["opcert"]
  tls:
    # kubernetes.io/tls Secret with the server certificate (tls.crt, tls.key).
    # Required: the signer refuses a plaintext non-loopback listener.
    secretName: ""
    # Secret holding the CA (ca.crt) that verifies client certificates.
    # Setting it enables mTLS client authentication.
    clientCASecretName: ""
  sopsKeys:
    # Secret of SOPS-encrypted *.json key files, mounted read-only at
    # /etc/bursa/signer/sops-keys. Each key must be a file name the signer
    # serves: *.json, not starting with a dot.
    secretName: ""
  ageKey:
    # Secret holding an age identity for SOPS decryption, exposed to the
    # signer through SOPS_AGE_KEY_FILE.
    secretName: ""
    key: keys.txt
  # Extra environment, e.g. SIGNER_WATERMARK_DSN from a secretKeyRef.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  networkPolicy:
    # Admit ingress to the signer port only from these peers
    # (NetworkPolicyPeer list).
    enabled: false
    from: []
