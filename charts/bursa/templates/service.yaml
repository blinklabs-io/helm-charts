{{- include "bursa.apiValidation" . -}}
{{- $apiPort := int (default 8080 (get .Values.environment "API_LISTEN_PORT")) -}}
{{- $apiLoopback := eq (trim (include "bursa.apiLoopback" .)) "true" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bursa.fullname" . }}
  labels: {{- include "bursa.labels" . | nindent 4 }}
  {{- if .Values.service.annotations }}
  annotations: {{- toYaml .Values.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if not $apiLoopback }}
    - name: api
      port: {{ .Values.service.ports.api }}
      targetPort: {{ $apiPort }}
    {{- end }}
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: 8081
  selector:
    app.kubernetes.io/name: {{ include "bursa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
