apiVersion: v1
kind: Service
metadata:
  name: {{ include "bursa.fullname" . }}
  labels: {{- include "bursa.labels" . | nindent 4 }}
  {{- if .Values.service.annotations }}
  annotations: {{- toYaml .Values.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if eq .Values.mode "signer" }}
    - name: signer
      port: {{ .Values.service.ports.signer }}
      targetPort: signer
    {{- else if eq .Values.mode "kes-agent" }}
    - name: kes-agent
      port: {{ .Values.service.ports.kesAgent }}
      targetPort: kes-agent
    {{- else }}
    - name: api
      port: {{ .Values.service.ports.api }}
      targetPort: 8080
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: 8081
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "bursa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
