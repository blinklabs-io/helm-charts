{{- include "bursa.apiValidation" . -}}
{{- $apiPort := int (default 8080 (get .Values.environment "API_LISTEN_PORT")) -}}
{{- $apiSecretName := trim (toString .Values.api.auth.existingSecret) -}}
{{- $apiSecretKey := trim (toString .Values.api.auth.existingSecretKey) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bursa.fullname" . }}
  labels:
    {{- include "bursa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.updateStrategy }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bursa.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- with .Values.extraPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: {{ include "bursa.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.tolerations }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      containers:
      - name: bursa
        command: ["bursa", "api"]
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          {{- range $key, $value := .Values.environment }}
          {{- if $value }}
          - name: {{ $key }}
            value: {{ $value | toString | quote }}
          {{- end }}
          {{- end }}
          {{- if $apiSecretName }}
          - name: API_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ $apiSecretName | quote }}
                key: {{ $apiSecretKey | quote }}
          {{- end }}
        ports:
          - name: api
            containerPort: {{ $apiPort }}
          - name: metrics
            containerPort: 8081
        {{- if .Values.resources }}
        resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- end }}
