apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bursa.fullname" . }}
  labels:
    {{- include "bursa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.updateStrategy }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if and (eq .Values.updateStrategy.type "RollingUpdate") .Values.updateStrategy.rollingUpdate }}
    rollingUpdate: {{- toYaml .Values.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bursa.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- with .Values.extraPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: {{ include "bursa.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if eq .Values.mode "signer" }}
      annotations:
        checksum/signer-config: {{ include "bursa.signerConfig" . | sha256sum }}
      {{- else if eq .Values.mode "kes-agent" }}
      annotations:
        checksum/kes-agent-config: {{ include "bursa.kesAgentConfig" . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if has .Values.mode (list "signer" "kes-agent") }}
      automountServiceAccountToken: false
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if has .Values.mode (list "signer" "kes-agent") }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      {{- $ka := eq .Values.mode "kes-agent" }}
      {{- $kaTLS := and $ka .Values.kesAgent.tls.secretName }}
      {{- $kaAge := and $ka .Values.kesAgent.ageIdentity.secretName }}
      {{- if or .Values.initContainers $kaTLS $kaAge }}
      initContainers:
        {{- if or $kaTLS $kaAge }}
        - name: kes-agent-secrets
          image: {{ .Values.kesAgent.copyImage }}
          command:
            - sh
            - -c
            - |
              set -e
              {{- if $kaTLS }}
              install -m 0400 /in/tls/tls.crt /out/tls.crt
              install -m 0400 /in/tls/tls.key /out/tls.key
              {{- end }}
              {{- if $kaAge }}
              install -m 0400 /in/age/{{ .Values.kesAgent.ageIdentity.key }} /out/age-identity.txt
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{- if $kaTLS }}
            - name: kes-agent-tls
              mountPath: /in/tls
              readOnly: true
            {{- end }}
            {{- if $kaAge }}
            - name: kes-agent-age
              mountPath: /in/age
              readOnly: true
            {{- end }}
            - name: kes-agent-secrets
              mountPath: /out
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
      - name: bursa
        {{- if eq .Values.mode "signer" }}
        command: ["bursa", "signer", "--config", "/etc/bursa/signer/config.yaml"]
        {{- else if eq .Values.mode "kes-agent" }}
        command: ["bursa", "kes-agent", "--config", "/etc/bursa/kes-agent/config.yaml"]
        {{- else }}
        command: ["bursa", "api"]
        {{- end }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          {{- range $key, $value := .Values.environment }}
          {{- if $value }}
          - name: {{ $key }}
            value: "{{ $value }}"
          {{- end }}
          {{- end }}
          {{- if eq .Values.mode "signer" }}
          {{- if .Values.signer.ageKey.secretName }}
          - name: SOPS_AGE_KEY_FILE
            value: /etc/bursa/signer/age/{{ .Values.signer.ageKey.key }}
          {{- end }}
          {{- with .Values.signer.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- end }}
          {{- if eq .Values.mode "kes-agent" }}
          {{- with .Values.kesAgent.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- end }}
        ports:
          {{- if eq .Values.mode "signer" }}
          - name: signer
            containerPort: {{ .Values.signer.port }}
          {{- else if eq .Values.mode "kes-agent" }}
          - name: kes-agent
            containerPort: {{ .Values.kesAgent.port }}
          {{- else }}
          - name: api
            containerPort: 8080
          - name: metrics
            containerPort: 8081
          {{- end }}
        {{- if eq .Values.mode "signer" }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /readyz
            port: signer
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: {{ .Values.signer.probes.timeoutSeconds }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: signer
            scheme: HTTPS
          periodSeconds: 20
          timeoutSeconds: {{ .Values.signer.probes.timeoutSeconds }}
          failureThreshold: 3
        volumeMounts:
          - name: signer-config
            mountPath: /etc/bursa/signer/config.yaml
            subPath: config.yaml
            readOnly: true
          - name: signer-tls
            mountPath: /etc/bursa/signer/tls
            readOnly: true
          {{- if .Values.signer.tls.clientCASecretName }}
          - name: signer-client-ca
            mountPath: /etc/bursa/signer/client-ca
            readOnly: true
          {{- end }}
          {{- if .Values.signer.sopsKeys.secretName }}
          - name: signer-sops-keys
            mountPath: /etc/bursa/signer/sops-keys
            readOnly: true
          {{- end }}
          {{- if .Values.signer.ageKey.secretName }}
          - name: signer-age
            mountPath: /etc/bursa/signer/age
            readOnly: true
          {{- end }}
          - name: tmp
            mountPath: /tmp
          {{- with .Values.signer.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        {{- if eq .Values.mode "kes-agent" }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # The health endpoints listen on loopback only, so readiness is an
        # exec probe. There is no liveness probe: readiness also covers the
        # shared store, and a database outage must not restart every replica.
        readinessProbe:
          exec:
            command: ["bursa", "kes-agent", "ready", "--config", "/etc/bursa/kes-agent/config.yaml"]
          periodSeconds: 10
          timeoutSeconds: {{ .Values.kesAgent.probes.timeoutSeconds }}
        volumeMounts:
          - name: kes-agent-config
            mountPath: /etc/bursa/kes-agent/config.yaml
            subPath: config.yaml
            readOnly: true
          - name: kes-agent-run
            mountPath: /run/bursa/kes-agent
          {{- if .Values.kesAgent.tls.clientCASecretName }}
          - name: kes-agent-client-ca
            mountPath: /etc/bursa/kes-agent/client-ca
            readOnly: true
          {{- end }}
          {{- if or .Values.kesAgent.tls.secretName .Values.kesAgent.ageIdentity.secretName }}
          - name: kes-agent-secrets
            mountPath: /run/bursa/kes-agent-secrets
            readOnly: true
          {{- end }}
          - name: tmp
            mountPath: /tmp
          {{- with .Values.kesAgent.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        {{- if .Values.resources }}
        resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- end }}
      {{- if eq .Values.mode "signer" }}
      volumes:
        - name: signer-config
          configMap:
            name: {{ include "bursa.fullname" . }}-signer
        - name: signer-tls
          secret:
            secretName: {{ .Values.signer.tls.secretName }}
            defaultMode: 0440
        {{- if .Values.signer.tls.clientCASecretName }}
        - name: signer-client-ca
          secret:
            secretName: {{ .Values.signer.tls.clientCASecretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.signer.sopsKeys.secretName }}
        - name: signer-sops-keys
          secret:
            secretName: {{ .Values.signer.sopsKeys.secretName }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.signer.ageKey.secretName }}
        - name: signer-age
          secret:
            secretName: {{ .Values.signer.ageKey.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.signer.ageKey.key }}
                path: {{ .Values.signer.ageKey.key }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.signer.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if eq .Values.mode "kes-agent" }}
      volumes:
        - name: kes-agent-config
          configMap:
            name: {{ include "bursa.fullname" . }}-kes-agent
        - name: kes-agent-run
          emptyDir:
            medium: Memory
        {{- if .Values.kesAgent.tls.secretName }}
        - name: kes-agent-tls
          secret:
            secretName: {{ .Values.kesAgent.tls.secretName }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.kesAgent.tls.clientCASecretName }}
        - name: kes-agent-client-ca
          secret:
            secretName: {{ .Values.kesAgent.tls.clientCASecretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.kesAgent.ageIdentity.secretName }}
        - name: kes-agent-age
          secret:
            secretName: {{ .Values.kesAgent.ageIdentity.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.kesAgent.ageIdentity.key }}
                path: {{ .Values.kesAgent.ageIdentity.key }}
        {{- end }}
        {{- if or .Values.kesAgent.tls.secretName .Values.kesAgent.ageIdentity.secretName }}
        - name: kes-agent-secrets
          emptyDir:
            medium: Memory
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.kesAgent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
