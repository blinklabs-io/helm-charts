{{- if and (eq .Values.mode "kes-agent") .Values.kesAgent.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bursa.fullname" . }}-kes-agent
  labels:
    {{- include "bursa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bursa.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: kes-agent
          protocol: TCP
      {{- with .Values.kesAgent.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if not (include "bursa.kesAgentMetricsLoopback" .) }}
    - ports:
        - port: metrics
          protocol: TCP
      {{- with .Values.kesAgent.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
