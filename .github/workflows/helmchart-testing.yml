name: Lint Charts
on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Chart-testing doesn't support Python 3.14 due to breaking changes in ast module
          python-version: "3.13.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            joined=$(echo "$changed" | paste -sd "," -)
            echo "changed_charts=$joined" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Test Dingo rendered manifests
        if: contains(steps.list-changed.outputs.changed_charts, 'charts/dingo')
        run: |
          python3 scripts/test-dingo-chart.py
          python3 scripts/test-dingo-private-apis.py

      - name: Test Cardano mesh and readiness
        if: contains(steps.list-changed.outputs.changed_charts, 'charts/cardano-node')
        run: |
          "${pythonLocation}/bin/python3" -m pip install -r scripts/requirements-cardano-tests.txt
          "${pythonLocation}/bin/python3" scripts/test-cardano-mesh.py
          "${pythonLocation}/bin/python3" -B scripts/test-cardano-readiness.py

      - name: Test Dolos readiness and rollout manifests
        if: contains(steps.list-changed.outputs.changed_charts, 'charts/dolos')
        run: |
          "${pythonLocation}/bin/python3" -m pip install -r scripts/requirements-dolos-tests.txt
          "${pythonLocation}/bin/python3" -B scripts/test-dolos-readiness.py
          "${pythonLocation}/bin/python3" -B scripts/test-dolos-readiness-deadlines.py

      - name: Test Ogmios readiness and rollout manifests
        if: contains(steps.list-changed.outputs.changed_charts, 'charts/ogmios')
        run: |
          "${pythonLocation}/bin/python3" -m pip install -r scripts/requirements-dolos-tests.txt
          "${pythonLocation}/bin/python3" -B scripts/test-ogmios-readiness.py
